<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  
  <g transform="translate(256, 256) rotate(-40) translate(-256, -256)">
    <!-- Central Bar Grip -->
    <rect x="200" y="238" width="112" height="36" rx="10" fill="#D2F639"/>
    
    <!-- Knurling texture lines on grip handle -->
    <line x1="230" y1="242" x2="230" y2="270" stroke="#112623" stroke-width="5" stroke-linecap="round" stroke-opacity="0.45"/>
    <line x1="246" y1="242" x2="246" y2="270" stroke="#112623" stroke-width="5" stroke-linecap="round" stroke-opacity="0.45"/>
    <line x1="266" y1="242" x2="266" y2="270" stroke="#112623" stroke-width="5" stroke-linecap="round" stroke-opacity="0.45"/>
    <line x1="282" y1="242" x2="282" y2="270" stroke="#112623" stroke-width="5" stroke-linecap="round" stroke-opacity="0.45"/>

    <!-- Left Weight Stack -->
    <!-- Inner Collar -->
    <rect x="186" y="230" width="14" height="52" rx="5" fill="#D2F639"/>
    <!-- Inner Large Plate -->
    <rect x="146" y="196" width="36" height="120" rx="14" fill="#D2F639"/>
    <line x1="164" y1="208" x2="164" y2="304" stroke="#112623" stroke-width="5" stroke-linecap="round" stroke-opacity="0.35"/>
    <!-- Outer Plate -->
    <rect x="100" y="174" width="40" height="164" rx="18" fill="#D2F639"/>
    <line x1="120" y1="190" x2="120" y2="322" stroke="#112623" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
    <!-- Outer End Cap / Nut -->
    <rect x="88" y="232" width="12" height="48" rx="4" fill="#D2F639"/>

    <!-- Right Weight Stack -->
    <!-- Inner Collar -->
    <rect x="312" y="230" width="14" height="52" rx="5" fill="#D2F639"/>
    <!-- Inner Large Plate -->
    <rect x="330" y="196" width="36" height="120" rx="14" fill="#D2F639"/>
    <line x1="348" y1="208" x2="348" y2="304" stroke="#112623" stroke-width="5" stroke-linecap="round" stroke-opacity="0.35"/>
    <!-- Outer Plate -->
    <rect x="372" y="174" width="40" height="164" rx="18" fill="#D2F639"/>
    <line x1="392" y1="190" x2="392" y2="322" stroke="#112623" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
    <!-- Outer End Cap / Nut -->
    <rect x="412" y="232" width="12" height="48" rx="4" fill="#D2F639"/>
  </g>
</svg>