server {
    listen 80;
    listen [::]:80;
    server_name sila.fitness;

    # Allow large-ish request bodies (e.g. progress photos, if added later).
    client_max_body_size 20m;

    # The static marketing site + admin console, synced here by publish.sh
    # (`/opt/silen/website`). Nothing in website/ is generated at runtime.
    root /opt/silen/website;
    index index.html;

    # Android App Links / Digital Asset Links verification. Served as a static
    # file (deploy/well-known/assetlinks.json, synced by publish.sh) so it
    # never goes through the API. Must resolve before the catch-all below.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        alias /opt/silen/deploy/well-known/assetlinks.json;
    }

    # ---- Admin console lives on admin.sila.fitness ---------------------------
    # Old links and bookmarks to the console pages land on the admin host instead.
    # The console itself is not served from this host at all.
    location = /admin.html {
        return 301 https://admin.sila.fitness/;
    }
    location ~ ^/(admin-login|confirm-operator-email)\.html$ {
        return 301 https://admin.sila.fitness$request_uri;
    }

    # ---- API ------------------------------------------------------------------
    # The app and the static site's "live" content live under /api/.
    location /api/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static site ----------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}
# certbot --nginx appends the TLS (443) server block + HTTP->HTTPS redirect here.

# Admin console. Serves the same /opt/silen/website directory as sila.fitness, but
# only the console's own pages plus the shared css/js/assets it needs.
server {
    listen 80;
    listen [::]:80;
    server_name admin.sila.fitness;

    client_max_body_size 20m;
    root /opt/silen/website;

    # ---- Console gate ---------------------------------------------------------
    # The console (admin.html, served at /) is handed out *only* to a request that
    # carries a live two-factor session cookie, which the API validates below.
    # Everything else the console needs (css/, js/, assets/) is public; this is
    # therefore the single choke point.
    location = / {
        auth_request /_admin_auth;
        error_page 401 = @admin_login;
        add_header Cache-Control "no-store" always;
        try_files /admin.html =404;
    }
    location = /admin.html {
        return 301 /;
    }

    # Internal subrequest backing the gate: forwards the request's cookies to the
    # API's session endpoint and turns its 200/401 into allow/deny. The body is
    # dropped since the endpoint takes none. If the API is unreachable this fails
    # closed (nginx answers 500 rather than serving the console) - which is the
    # right way round: no API, no proof of session, no console.
    location = /_admin_auth {
        internal;
        proxy_pass http://127.0.0.1:5010/api/admin/auth/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated (or expired) console request -> the sign-in page, which posts
    # back to /api/admin/auth/* and lands the visitor on / once the cookie exists.
    # `next` lets the console send people back to the view they wanted.
    location @admin_login {
        return 302 /admin-login.html?next=/;
    }

    # Deliberately NOT gated: the sign-in page hands out the cookie in the first
    # place, and the email-confirmation page is opened from an operator invite.
    location ~ ^/(admin-login|confirm-operator-email)\.html$ {
        try_files $uri =404;
    }
    location ~ ^/(css|js|assets)/ {
        try_files $uri =404;
    }

    # ---- API ------------------------------------------------------------------
    # Same-origin on purpose: the admin session cookie is host-only and
    # SameSite=Strict, so the console must call /api/ on this host.
    location /api/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nothing else from the marketing site is served on the admin host.
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sila.fitness;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Uploaded images (split hero images, etc - see Silen.Common.Options.ImageUploadOptions
# and IImageUploadService). Served straight off disk, never through the API: the
# API's job ends at writing the file into deploy/uploads/ (bind-mounted into
# silen-api at /app/uploads - same directory, different path on each side).
server {
    listen 80;
    listen [::]:80;
    server_name images.sila.fitness;
    root /opt/silen/deploy/uploads;
    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
