server {
    listen 80;
    listen [::]:80;
    server_name silafit.tappit.click;

    # Allow large-ish request bodies (e.g. progress photos, if added later).
    client_max_body_size 20m;

    # Android App Links / Digital Asset Links verification. Served as a static
    # file (deploy/well-known/assetlinks.json, synced by publish.sh) so it
    # never goes through the API. Must resolve before the catch-all below.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        alias /opt/silen/deploy/well-known/assetlinks.json;
    }

    location / {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# certbot --nginx appends the TLS (443) server block + HTTP->HTTPS redirect here.
