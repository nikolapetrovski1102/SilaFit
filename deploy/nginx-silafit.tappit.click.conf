server {
    listen 80;
    listen [::]:80;
    server_name silafit.tappit.click;

    # Allow large-ish request bodies (e.g. progress photos, if added later).
    client_max_body_size 20m;

    # The static marketing site + admin console, synced here by publish.sh
    # (`/opt/silen/website`). Nothing in website/ is generated at runtime.
    root /opt/silen/website;
    index index.html;

    # Android App Links / Digital Asset Links verification. Served as a static
    # file (deploy/well-known/assetlinks.json, synced by publish.sh) so it
    # never goes through the API. Must resolve before the catch-all below.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        alias /opt/silen/deploy/well-known/assetlinks.json;
    }

    # ---- Admin console gate ----------------------------------------------------
    # admin.html is the console. It is served *only* to a request that carries a
    # live two-factor session cookie, which the API validates below. Everything the
    # console needs besides that one document (css/, js/, assets/) is shared with
    # the public site and stays public; this is therefore the single choke point.
    #
    # admin-login.html is deliberately NOT gated - it's the page that hands out the
    # cookie in the first place.
    location = /admin.html {
        auth_request /_admin_auth;
        error_page 401 = @admin_login;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Internal subrequest backing the gate: forwards the request's cookies to the
    # API's session endpoint and turns its 200/401 into allow/deny. The body is
    # dropped since the endpoint takes none. If the API is unreachable this fails
    # closed (nginx answers 500 rather than serving the console) - which is the
    # right way round: no API, no proof of session, no console.
    location = /_admin_auth {
        internal;
        proxy_pass http://127.0.0.1:5010/api/admin/auth/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated (or expired) console request -> the sign-in page, which posts
    # back to /api/admin/auth/* and lands the visitor on admin.html once the cookie
    # exists. `next` lets the console send people back to the view they wanted.
    location @admin_login {
        return 302 /admin-login.html?next=/admin.html;
    }

    # ---- API ------------------------------------------------------------------
    # The app, the static site's "live" content, and the admin auth endpoints all
    # live under /api/. Same-origin on purpose: the admin session cookie is
    # SameSite=Strict, so it would not be sent on a cross-site fetch.
    location /api/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static site ----------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}
# certbot --nginx appends the TLS (443) server block + HTTP->HTTPS redirect here.
