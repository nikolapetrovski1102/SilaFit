# Baseline response hardening for the static vhosts (sila.fitness, admin.sila.fitness,
# images.sila.fitness). deploy.sh installs this as
# /etc/nginx/snippets/silen-security-headers.conf.
#
# nginx drops every inherited add_header in a location that declares one of its
# own, so any location with its own add_header must include this file again.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
