name: silenfit

services:
  silen-postgres:
    image: postgres:18
    container_name: silen-postgres
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "silendb"
      # scram for every TCP login (the image default for new clusters, set explicitly).
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    # Sized for the 4 GB / 2 vCPU box next to a 1 GB API: ~25% of RAM as shared
    # buffers, the planner told how much the OS page cache can hold, SSD costs.
    # Override per box through .env.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - log_min_duration_statement=${PG_LOG_SLOW_MS:-1000}
      - -c
      - log_lock_waits=on
    ports:
      - "127.0.0.1:${PG_PORT:-54320}:5432"   # localhost only — not exposed publicly
    volumes:
      # postgres:18 keeps PGDATA in a major-version subdirectory of this path.
      - silen-pgdata:/var/lib/postgresql
    shm_size: 256m
    restart: unless-stopped
    mem_limit: "${PG_MEM_LIMIT:-1536m}"
    memswap_limit: "${PG_MEM_LIMIT:-1536m}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d silendb"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  silen-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: silen-api
    depends_on:
      silen-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      # Behind nginx TLS termination. The runtime auto-adds ForwardedHeadersMiddleware
      # (trusting X-Forwarded-For/Proto) when this is set AND the app is running in a
      # container — no code change needed. Without it, app.UseHttpsRedirection() would
      # see every request as plain http (nginx talks http to Kestrel) and redirect it
      # back to https, which nginx re-terminates and forwards as http again: a loop.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Overrides ConnectionStrings:SilenDb from appsettings.json. silen_app (created by
      # database/apply.sh) holds nothing but USAGE on schema dbo + EXECUTE on its
      # functions, which are SECURITY DEFINER - the app only ever calls them, so it
      # never needs the postgres superuser. Only the one-off tools that run inline
      # SQL (seed-mock-data) still connect as postgres. Pool capped below
      # max_connections so the cron tools always find a free slot.
      ConnectionStrings__SilenDb: "Host=silen-postgres;Port=5432;Database=silendb;Username=silen_app;Password=${APP_DB_PASSWORD};Maximum Pool Size=40"
      # Overrides Jwt:SigningKey from appsettings.json (kept out of source control — see deploy/.env)
      Jwt__Issuer: "SilenApi"
      Jwt__Audience: "SilenApp"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      Jwt__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-1440}"
      # AES-256-GCM key for application-level column encryption (FieldCipher) -
      # kept out of source control the same way as Jwt__SigningKey, see deploy/.env
      Encryption__MasterKeyBase64: "${ENCRYPTION_MASTER_KEY}"
      # OAuth client ids — leave unset to disable that sign-in method server-side checks.
      GoogleAuth__ClientIds__0: "${GOOGLE_WEB_CLIENT_ID:-}"
      AppleAuth__ClientIds__0: "${APPLE_BUNDLE_ID:-com.nikolapetrovski.silafit}"
      # OpenRouter — powers AI-narrated progress analytics text. Leave blank to disable.
      OpenRouter__ApiKey: "${OPENROUTER_API_KEY:-}"
      OpenRouter__Model: "${OPENROUTER_MODEL:-openai/gpt-4.1}"
      # Vision model behind the meal tracker's AI photo scan (Advanced, 3/day).
      OpenRouter__FoodScanModel: "${OPENROUTER_FOOD_SCAN_MODEL:-openai/gpt-6-sol}"
      FeatureFlags__DevTiersFree: "false"
      # Admin console sign-in (Silen.Common/Options/AdminAuthOptions.cs). Two factors:
      # a PBKDF2-hashed password in dbo.AdminUsers, then a TOTP code checked against
      # the secret in TotpSecretCipher (encrypted with ENCRYPTION_MASTER_KEY above).
      # CookieSecure must stay true in production - nginx only serves admin.html to a
      # request carrying this cookie. Accounts are provisioned by
      # `docker compose --profile tools run --rm silen-admin-provision`.
      AdminAuth__CookieSecure: "true"
      AdminAuth__SessionIdleMinutes: "${ADMIN_SESSION_IDLE_MINUTES:-30}"
      AdminAuth__LockoutThreshold: "${ADMIN_LOCKOUT_THRESHOLD:-5}"
      AdminAuth__LockoutMinutes: "${ADMIN_LOCKOUT_MINUTES:-15}"
      # SMTP - powers email verification codes and the monthly progress emails.
      # Leave SMTP_HOST blank to disable outbound email.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-SilaFit}"
      # App Store / Play Store review demo account. When both are set, registering
      # with REVIEWER_BYPASS_EMAIL gets this fixed code instead of a random emailed
      # one, so reviewers can sign in without inbox access. Leave both blank outside
      # of an active review.
      ReviewerBypass__Email: "${REVIEWER_BYPASS_EMAIL:-}"
      ReviewerBypass__Code: "${REVIEWER_BYPASS_CODE:-}"
      # Push reminders (Silen.Services -> NotificationPublishService). By default
      # the publisher runs from the frequent cron entry below, not in the API
      # (RunInApi=false) - flip NOTIFICATION_RUN_IN_API=true to host it here
      # instead. Push__Enabled + a service-account file turn on real FCM sends;
      # without them the service still composes + records notifications.
      NotificationPublish__RunInApi: "${NOTIFICATION_RUN_IN_API:-false}"
      Push__Enabled: "${PUSH_ENABLED:-false}"
      Push__ProjectId: "${PUSH_PROJECT_ID:-}"
      Push__ServiceAccountJsonPath: "${PUSH_SERVICE_ACCOUNT_PATH:-/secrets/fcm-service-account.json}"
      # App Store Server API / Play Developer API — power the verify-purchase
      # endpoint and the store webhooks (SubscriptionWebhooksController). The
      # same credential files silen-subscription-sync uses below.
      AppStoreServer__KeyId: "${APP_STORE_SERVER_KEY_ID:-}"
      AppStoreServer__IssuerId: "${APP_STORE_SERVER_ISSUER_ID:-}"
      AppStoreServer__BundleId: "${APP_STORE_SERVER_BUNDLE_ID:-com.nikolapetrovski.silafit}"
      AppStoreServer__PrivateKeyPath: "${APP_STORE_SERVER_PRIVATE_KEY_PATH:-/secrets/appstore-server-key.p8}"
      AppStoreServer__Environment: "${APP_STORE_SERVER_ENVIRONMENT:-Production}"
      GooglePlay__PackageName: "${GOOGLE_PLAY_PACKAGE_NAME:-com.nikolapetrovski.silafit}"
      GooglePlay__ServiceAccountJsonPath: "${GOOGLE_PLAY_SERVICE_ACCOUNT_PATH:-/secrets/play-service-account.json}"
      # Partner lead provisioning (PartnerController, docs/partner-integration.md).
      # Basic auth credentials and the 32-byte base64 AES-256-GCM payload key shared
      # with the partner. Leave any of them blank and every partner request is refused.
      Partner__Username: "${PARTNER_USERNAME:-}"
      Partner__Password: "${PARTNER_PASSWORD:-}"
      Partner__PayloadKeyBase64: "${PARTNER_PAYLOAD_KEY:-}"
    ports:
      - "127.0.0.1:${API_PORT:-5010}:8080"   # localhost only — nginx proxies to it
    volumes:
      - ./secrets:/secrets:ro
      # Uploaded split/plan images (Silen.Common.Options.ImageUploadOptions,
      # default StoragePath "uploads" relative to /app). nginx's images.sila.fitness
      # vhost (deploy/nginx-sila.fitness.conf) serves this same host directory
      # straight off disk - the API is only ever hit to write a new file here.
      - ./uploads:/app/uploads
    restart: unless-stopped
    # Backstop like the db service's mem_limit above: without a ceiling, a leak can
    # let the API eat all host RAM and push everything (including PostgreSQL) into
    # swap. Docker OOM-kills the container at the limit and `restart: unless-stopped`
    # brings it back, which is a much faster recovery than a wedged, swap-thrashing host.
    mem_limit: "${API_MEM_LIMIT:-1024m}"

  # Admin console enrollment / credential rotation. Profile-gated like the other
  # tools: a plain `docker compose up` never starts it. Run it explicitly, from
  # the deploy dir on the server:
  #
  #   docker compose --profile tools run --rm silen-admin-provision
  #   # non-interactive variant, optionally with a recovery email:
  #   SILEN_ADMIN_USERNAME=admin SILEN_ADMIN_PASSWORD='...' SILEN_ADMIN_EMAIL='...' \
  #     docker compose --profile tools run --rm silen-admin-provision
  #
  # It prints the otpauth:// URI to add to an authenticator app, and re-running it
  # rotates both factors (dropping every live console session on the way).
  silen-admin-provision:
    build:
      context: ../backend
      dockerfile: src/Silen.Tools.AdminProvision/Dockerfile
    container_name: silen-admin-provision
    profiles: ["tools"]
    depends_on:
      silen-postgres:
        condition: service_healthy
    environment:
      SILEN_CONNECTION_STRING: "Host=silen-postgres;Port=5432;Database=silendb;Username=silen_app;Password=${APP_DB_PASSWORD}"
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY}"
      SILEN_ADMIN_USERNAME: "${SILEN_ADMIN_USERNAME:-}"
      SILEN_ADMIN_PASSWORD: "${SILEN_ADMIN_PASSWORD:-}"
      # Optional recovery email - enables "send email code instead" at sign-in
      # (via the API's own SMTP_* settings above). Leave blank to skip.
      SILEN_ADMIN_EMAIL: "${SILEN_ADMIN_EMAIL:-}"
    # Masked prompts need a terminal; harmless when the env vars above are used instead.
    stdin_open: true
    tty: true

  # Monthly review batch: generates + emails the monthly AI overview ("what
  # improved / what to improve / how to continue") for every active ADVANCED
  # subscriber. Profile-gated like the other tools, so a plain
  # `docker compose up` never starts it - deploy.sh installs a cron entry that
  # runs it on the 1st of each month for the previous month.
  #
  # Run it by hand (e.g. a backfill) with:
  #   docker compose --profile tools run --rm --build silen-monthly-review
  # Forward tool flags after `--`, e.g. a no-email backfill of August 2026:
  #   docker compose --profile tools run --rm silen-monthly-review -- --year=2026 --month=8 --dry-run
  silen-monthly-review:
    build:
      context: ../backend
      dockerfile: src/Silen.Tools.MonthlyReview/Dockerfile
    container_name: silen-monthly-review
    profiles: ["tools"]
    depends_on:
      silen-postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ConnectionStrings__SilenDb: "Host=silen-postgres;Port=5432;Database=silendb;Username=silen_app;Password=${APP_DB_PASSWORD}"
      # AES-256-GCM key: the report snapshot decrypts bodyweight/meal columns
      # the same way the API does, so it must match ENCRYPTION_MASTER_KEY.
      Encryption__MasterKeyBase64: "${ENCRYPTION_MASTER_KEY}"
      # OpenRouter - required: an unset key means every user fails to generate.
      OpenRouter__ApiKey: "${OPENROUTER_API_KEY:-}"
      OpenRouter__Model: "${OPENROUTER_MODEL:-openai/gpt-4.1}"
      # SMTP - when Smtp__Host is blank the batch still generates + stores each
      # report but sends no email (deliveries are recorded as 'Generated').
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-SilaFit}"
      MonthlyReview__PlanCode: "${MONTHLY_REVIEW_PLAN_CODE:-ADVANCED}"
      MonthlyReview__SendEmails: "${MONTHLY_REVIEW_SEND_EMAILS:-true}"
      # Non-paying pass: stats teaser + upgrade CTA (no AI call). Set false to
      # keep the batch paying-subscribers-only again.
      MonthlyReview__SendUpsellEmails: "${MONTHLY_REVIEW_SEND_UPSELL_EMAILS:-true}"
      MonthlyReview__UpsellMinTrackedUnits: "${MONTHLY_REVIEW_UPSELL_MIN_TRACKED_UNITS:-1}"
      MonthlyReview__UpgradeUrl: "${MONTHLY_REVIEW_UPGRADE_URL:-https://sila.fitness/#pricing}"

  # Notification publish batch: decides, per opted-in user and in that user's
  # own timezone, which reminder is due (gym time, log-your-sets, calories/meal
  # idea, motivation, or the comeback message) and pushes it. Profile-gated like
  # the other tools; deploy.sh builds it once and installs a cron entry that runs
  # it every five minutes. Dedupe keys make overlapping runs harmless.
  #
  # Run it by hand with:
  #   docker compose --profile tools run --rm --build silen-notification-publish
  # Testing one user, writing nothing:
  #   docker compose --profile tools run --rm silen-notification-publish -- --user=<guid> --dry-run
  silen-notification-publish:
    build:
      context: ../backend
      dockerfile: src/Silen.Tools.NotificationPublish/Dockerfile
    container_name: silen-notification-publish
    profiles: ["tools"]
    depends_on:
      silen-postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ConnectionStrings__SilenDb: "Host=silen-postgres;Port=5432;Database=silendb;Username=silen_app;Password=${APP_DB_PASSWORD}"
      NotificationPublish__Enabled: "${NOTIFICATION_PUBLISH_ENABLED:-true}"
      NotificationPublish__RunInApi: "false"
      # Monthly "unlock your review" push to non-paying users, on the 1st at
      # 09:00 local (the usual SendWindowMinutes applies). Dedupe keeps it to
      # once per local month. Set false to disable just this category.
      NotificationPublish__MonthlyReviewUpsellEnabled: "${NOTIFICATION_MONTHLY_UPSELL_ENABLED:-true}"
      NotificationPublish__MonthlyReviewUpsellDayOfMonth: "${NOTIFICATION_MONTHLY_UPSELL_DAY:-1}"
      NotificationPublish__MonthlyReviewUpsellLocalTime: "${NOTIFICATION_MONTHLY_UPSELL_TIME:-09:00}"
      Push__Enabled: "${PUSH_ENABLED:-false}"
      Push__ProjectId: "${PUSH_PROJECT_ID:-}"
      Push__ServiceAccountJsonPath: "${PUSH_SERVICE_ACCOUNT_PATH:-/secrets/fcm-service-account.json}"
    volumes:
      - ./secrets:/secrets:ro

  # Weekly AI plan generation batch: for every active ADVANCED subscriber, looks
  # at what they actually trained/ate last week and generates a custom split +
  # full-week diet plan (Mon-Sun, breakfast/lunch/dinner plus target-filling snacks) with a week-long
  # shopping list, then pushes/emails them that it's ready. The model may keep
  # the user's current split when it already fits. The split remains a
  # recommendation; the ADVANCED subscriber's new diet plan is activated
  # automatically. Profile-gated like the other tools;
  # deploy.sh installs a cron entry that runs it every Sunday.
  #
  # Run it by hand with:
  #   docker compose --profile tools run --rm --build silen-weekly-plan-generation
  # Testing one user, writing nothing:
  #   docker compose --profile tools run --rm silen-weekly-plan-generation -- --user=<guid> --dry-run
  silen-weekly-plan-generation:
    build:
      context: ../backend
      dockerfile: src/Silen.Tools.WeeklyPlanGeneration/Dockerfile
    container_name: silen-weekly-plan-generation
    profiles: ["tools"]
    depends_on:
      silen-postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ConnectionStrings__SilenDb: "Host=silen-postgres;Port=5432;Database=silendb;Username=silen_app;Password=${APP_DB_PASSWORD}"
      # AES-256-GCM key: reads decrypted bodyweight/meal columns the same way
      # the API does, so it must match ENCRYPTION_MASTER_KEY.
      Encryption__MasterKeyBase64: "${ENCRYPTION_MASTER_KEY}"
      # OpenRouter - required: an unset key means every user fails to generate.
      OpenRouter__ApiKey: "${OPENROUTER_API_KEY:-}"
      OpenRouter__Model: "${OPENROUTER_MODEL:-openai/gpt-4.1-mini}"
      # SMTP - when Smtp__Host is blank the batch still generates + stores each
      # plan but sends no email (deliveries are recorded as 'Generated').
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-SilaFit}"
      Push__Enabled: "${PUSH_ENABLED:-false}"
      Push__ProjectId: "${PUSH_PROJECT_ID:-}"
      Push__ServiceAccountJsonPath: "${PUSH_SERVICE_ACCOUNT_PATH:-/secrets/fcm-service-account.json}"
      WeeklyPlanGeneration__SendEmails: "${WEEKLY_PLAN_SEND_EMAILS:-true}"
      WeeklyPlanGeneration__SendPushNotifications: "${WEEKLY_PLAN_SEND_PUSH:-true}"
      WeeklyPlanGeneration__MinTrackedActivityUnits: "${WEEKLY_PLAN_MIN_TRACKED_UNITS:-2}"
      WeeklyPlanGeneration__ExerciseCandidatePoolSize: "${WEEKLY_PLAN_EXERCISE_POOL_SIZE:-60}"
      WeeklyPlanGeneration__MealCandidatePoolSizePerType: "${WEEKLY_PLAN_MEAL_POOL_SIZE:-15}"
    volumes:
      - ./secrets:/secrets:ro

  # Subscription reconciliation batch: re-verifies active, auto-renewing
  # SubscriptionReceipts rows against the issuing store (Apple App Store
  # Server API / Google Play Developer API) and applies whatever status
  # change a missed or late webhook (SubscriptionWebhooksController) wouldn't
  # have caught. A safety net, not the primary path - idempotent by
  # construction since activation is keyed on (Store, TransactionId).
  # Profile-gated like the other tools; deploy.sh builds it once and installs
  # a cron entry that runs it every 4 hours.
  #
  # Run it by hand with:
  #   docker compose --profile tools run --rm --build silen-subscription-sync
  # Testing one user, writing nothing:
  #   docker compose --profile tools run --rm silen-subscription-sync -- --user=<guid> --dry-run
  silen-subscription-sync:
    build:
      context: ../backend
      dockerfile: src/Silen.Tools.SubscriptionSync/Dockerfile
    container_name: silen-subscription-sync
    profiles: ["tools"]
    depends_on:
      silen-postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ConnectionStrings__SilenDb: "Host=silen-postgres;Port=5432;Database=silendb;Username=silen_app;Password=${APP_DB_PASSWORD}"
      AppStoreServer__KeyId: "${APP_STORE_SERVER_KEY_ID:-}"
      AppStoreServer__IssuerId: "${APP_STORE_SERVER_ISSUER_ID:-}"
      AppStoreServer__BundleId: "${APP_STORE_SERVER_BUNDLE_ID:-com.nikolapetrovski.silafit}"
      AppStoreServer__PrivateKeyPath: "${APP_STORE_SERVER_PRIVATE_KEY_PATH:-/secrets/appstore-server-key.p8}"
      AppStoreServer__Environment: "${APP_STORE_SERVER_ENVIRONMENT:-Production}"
      GooglePlay__PackageName: "${GOOGLE_PLAY_PACKAGE_NAME:-com.nikolapetrovski.silafit}"
      GooglePlay__ServiceAccountJsonPath: "${GOOGLE_PLAY_SERVICE_ACCOUNT_PATH:-/secrets/play-service-account.json}"
    volumes:
      - ./secrets:/secrets:ro

  # One-off SQL Server -> PostgreSQL data copy (Silen.Tools.MigrateToPostgres),
  # driven by migrate-to-postgres.sh. Reads the legacy database as sa, writes the
  # target database as postgres. TARGET_DB picks the database (the rehearsal uses
  # a throwaway one). Remove together with silen-sqlserver after the cutover.
  silen-migrate-to-postgres:
    build:
      context: ../backend
      dockerfile: src/Silen.Tools.MigrateToPostgres/Dockerfile
    container_name: silen-migrate-to-postgres
    profiles: ["legacy"]
    environment:
      SOURCE_CONNECTION_STRING: "Server=silen-sqlserver,1433;Database=SilenDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      TARGET_CONNECTION_STRING: "Host=silen-postgres;Port=5432;Database=${TARGET_DB:-silendb};Username=postgres;Password=${POSTGRES_PASSWORD};Command Timeout=0"

  # Mock-data seeder (Silen.Tools.SeedMockData). Fills one existing user's
  # workouts/meals/hydration/bodyweight with a generated month of realistic
  # history, so the Today/Progress/monthly screens have something to show, or
  # creates/reuses the silen-demo-* Guest accounts by device id. Profile-gated
  # like the other tools, so a plain `docker compose up` never starts it.
  #
  # Run it by hand, from the deploy dir on the server:
  #   docker compose --profile tools run --rm --build silen-seed-mock-data -- --email=you@example.com
  #   docker compose --profile tools run --rm silen-seed-mock-data -- --user-id=<guid> --days=30
  #
  # Re-running replaces that user's logs (wipe-and-regenerate), so it is safe to
  # repeat while iterating. Run --help via the tool for the full flag list.
  silen-seed-mock-data:
    build:
      context: ../backend
      dockerfile: src/Silen.Tools.SeedMockData/Dockerfile
    container_name: silen-seed-mock-data
    profiles: ["tools"]
    depends_on:
      silen-postgres:
        condition: service_healthy
    environment:
      SILEN_CONNECTION_STRING: "Host=silen-postgres;Port=5432;Database=silendb;Username=postgres;Password=${POSTGRES_PASSWORD}"
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY}"

  # The pre-PostgreSQL database, kept only so a rollback (or a re-run of the
  # data copy in migrate-to-postgres.sh) stays possible. Profile-gated: nothing
  # starts it unless asked for by name with --profile legacy. Remove this service
  # and the silen-sqldata volume once the PostgreSQL cutover is confirmed.
  silen-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: silen-sqlserver
    profiles: ["legacy"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
      # Cap SQL Server's buffer pool. Without this, `max server memory` defaults to
      # effectively unlimited: on a small box mssql commits nearly all RAM, the OS +
      # API get pushed into swap, and the resulting paging shows up as pinned CPU +
      # thousands of disk IOPS even with zero users. Override per box via .env.
      MSSQL_MEMORY_LIMIT_MB: "${MSSQL_MEMORY_LIMIT_MB:-2048}"
    ports:
      - "127.0.0.1:${DB_PORT:-14340}:1433"   # localhost only — not exposed publicly
    volumes:
      - silen-sqldata:/var/opt/mssql
    restart: unless-stopped
    # Hard ceiling as a backstop to the SQL-level cap above. Keep it a little above
    # MSSQL_MEMORY_LIMIT_MB so SQL Server (cgroup-aware) has headroom for the CLR /
    # connections / plan cache that live outside the buffer pool.
    mem_limit: "${DB_MEM_LIMIT:-2560m}"
    memswap_limit: "${DB_MEM_LIMIT:-2560m}"   # = mem_limit ⇒ the container itself never swaps
    healthcheck:
      test: >
        /bin/bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" ||
                      /opt/mssql-tools/bin/sqlcmd  -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"    -Q "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 45s

volumes:
  silen-pgdata:
  silen-sqldata:
