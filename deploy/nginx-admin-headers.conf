# Admin console hardening: the baseline headers plus a Content-Security-Policy.
# deploy.sh installs this as /etc/nginx/snippets/silen-admin-headers.conf.
#
# 'unsafe-inline' is still needed for the pages' inline <script> blocks and on*=
# handlers; the policy still stops the console from loading scripts from, or
# sending data to, any other origin, and from being framed.
include /etc/nginx/snippets/silen-security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
