<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172d30" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5eedd" media="(prefers-color-scheme: light)" />
  <title>SilaFit Admin — Confirm email</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/img/branding/app_icon.png" />
  <link rel="stylesheet" href="css/base.css?v=20260915-teal" />
  <link rel="stylesheet" href="css/admin-login.css" />
  <!-- Resolve the theme before first paint: saved choice → OS → dark. See js/theme.js -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('silafit-theme'); } catch (e) { /* private mode */ }
      var theme = (stored === 'light' || stored === 'dark')
        ? stored
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body class="login-page">

  <div class="bloom bloom--primary login-bloom login-bloom--primary"></div>
  <div class="bloom bloom--secondary login-bloom login-bloom--secondary"></div>

  <main class="login-shell">

    <a class="login-brand" href="index.html">
      <img src="assets/img/branding/app_icon_transparent.png" alt="" />
      <span>SilaFit</span>
      <span class="chip chip--accent">Admin</span>
    </a>

    <section class="login-card" aria-labelledby="confirmHeading">
      <header class="login-card__head">
        <span class="eyebrow eyebrow--accent">Restricted console</span>
        <h1 id="confirmHeading">Confirm your email</h1>
        <p class="body-sm" id="confirmIntro">Checking your confirmation link…</p>
      </header>

      <div class="login-alert" id="confirmAlert" role="alert" hidden></div>

      <a class="btn btn--primary login-submit" id="confirmGoToLogin" href="admin-login.html" hidden>
        Go to sign in
      </a>
    </section>

    <div class="login-foot">
      <a href="index.html">← Back to sila.fitness</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode">
        <svg class="theme-toggle__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></svg>
        <svg class="theme-toggle__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.6A8.6 8.6 0 0 1 9.4 4 8.6 8.6 0 1 0 20 14.6Z"/></svg>
      </button>
    </div>

  </main>

  <script src="js/theme.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/confirm-operator-email.js"></script>
</body>
</html>
