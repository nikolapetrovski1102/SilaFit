  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('silafit-theme'); } catch (e) {}
      var theme = (stored === 'light' || stored === 'dark')
        ? stored
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    .download {
      min-height: calc(100vh - 72px);
      min-height: calc(100svh - 72px);
      display: grid;
      place-items: center;
      padding: clamp(48px, 8vw, 120px) var(--gutter);
    }
    .download__card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 640px;
      text-align: center;
    }
    .download__card .sila { --sila-size: clamp(150px, 26vw, 220px); }
    .download__card h1 {
      color: var(--high-emphasis);
      font-size: clamp(44px, 8vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 600;
    }
    .download__lead {
      max-width: 36ch;
      color: var(--on-surface-variant);
      font-size: clamp(17px, 1.6vw, 20px);
      line-height: 1.5;
    }
    .download__badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .store-badge--soon { opacity: 0.55; cursor: default; pointer-events: none; }
    .store-badge--soon::after { display: none; }
    .download .store-qr {
      padding: 14px 18px 14px 14px;
      border-radius: 18px;
      background: var(--surface-low);
      text-align: left;
    }
    /* On Android (until Play is live) lead with the "coming soon" note. */
    [data-platform="android"] .download__note { color: var(--high-emphasis); font-weight: 500; }
  </style>
</head>
